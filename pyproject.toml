[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dukaonesdk"
version = "1.0.7"
description = "Duka One ventilation SDK"
readme = "readme.md"
authors = [
  { name = "Jens Østergaard Nielsen" },
]
license = "GPL-3.0"
dependencies = []

[project.urls]
Homepage = "https://github.com/dingusdk/dukaonesdk"
Repository = "https://github.com/dingusdk/dukaonesdk"

[tool.setuptools.packages.find]
include = ["dukaonesdk*"]