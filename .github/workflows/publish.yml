name: Publish to TestPyPI and PyPI

on:
  release:
    types: [published, prereleased, released]
  workflow_dispatch:
    inputs:
      target:
        description: "Release target (testpypi only for manual testing, or both)"
        type: choice
        default: testpypi
        options:
          - testpypi
          - both

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: >-
      (github.event_name == 'release' && github.event.action == 'prereleased') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'testpypi' || inputs.target == 'both'))
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: >-
      (
        github.event_name == 'release' &&
        (github.event.action == 'released' || (github.event.action == 'published' && github.event.release.prerelease == false))
      ) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'both')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@release/v1